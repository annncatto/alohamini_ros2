urdf:
  joint: vertical_move
  q_at_physical_min_m: -0.3
  q_at_physical_max_m: 0.3
  clamp_to_physical_range: true
  mapping: q = q_min + (height_mm - physical_min_mm) * (q_max - q_min) / (physical_max_mm - physical_min_mm)

