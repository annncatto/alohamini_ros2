alohamini_camera:
  ros__parameters:
    host: 127.0.0.1
    port: 5557
    camera_names: [forward, wrist_right]
    publish_raw: true
    timestamp_mode: host_wall
    max_transport_latency_ms: 250.0
    poll_rate_hz: 200.0
    forward:
      namespace: /alohamini/cameras/forward
      frame_id: forward_camera_optical
      camera_info_url: ""
    wrist_right:
      namespace: /alohamini/cameras/wrist_right
      frame_id: right_camera_optical
      camera_info_url: ""
