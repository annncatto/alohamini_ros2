schema_version: 1

moving_jaw_vhacd:
  bootstrap_generator: /home/anncatto/RoboTwin/script/generate_alohamini_collision_meshes.py
  generator_migrated: false
  source: ../../meshes/visual/left_Moving_Jaw.STL
  source_sha256: 01710e46191ba7e868cc78bdf34faafef7b154ee8869e2ec5a484ef13c81aea9
  left_right_source_identical: true
  output_glob: ../collision_meshes/moving_jaw_vhacd_*.stl
  parameters:
    maxConvexHulls: 6
    resolution: 100000
    minimumVolumePercentErrorAllowed: 2.0
    maxNumVerticesPerCH: 32
  measured_volume_cm3:
    visual_mesh: 28.78519653464993
    old_single_convex_hull: 60.815154935831956
    generated_six_piece_total: 32.85102427886363
  status: simulation_provisional
  note: Physical jaw geometry and safety clearance still require hardware comparison.

arm_link_vhacd:
  generator: ../../scripts/generate_arm_collision_meshes.py
  environment: RoboTwin
  report: arm_collision_report.json
  left_right_sources_identical: true
  output_glob: ../../meshes/collision/{arm_base,rotation_pitch,upper_arm,lower_arm,wrist_pitch_roll,wrist_yaw,fixed_jaw,wrist_camera}_vhacd.stl
  common_parameters:
    resolution: 100000
    minimumVolumePercentErrorAllowed: 2.0
    maxNumVerticesPerCH: 32
  max_convex_hulls_by_link:
    arm_base: 8
    rotation_pitch: 6
    upper_arm: 8
    lower_arm: 8
    wrist_pitch_roll: 4
    wrist_yaw: 6
    fixed_jaw: 8
    wrist_camera: 2
  status: generated_and_cad_home_reviewed
  fixed_jaw_loading_policy:
    combined_mesh: fixed_jaw_vhacd.stl
    combined_mesh_loaded: false
    separately_loaded_pieces: [0, 1, 2, 3, 4, 5, 7]
    replaced_piece: 6
    replacement:
      type: box
      name: fixed_finger_pad
      origin_xyz_m: [-0.015, 0.0, 0.072]
      size_xyz_m: [0.010, 0.014, 0.064]
      inner_face_x_m: -0.010
    reason: Loading all disconnected pieces through one mesh lets some consumers re-convexify the complete Fixed_Jaw and close the grasp aperture. Piece 06 also expands into the inner contact face, so the reviewed planar pad replaces it and matches the distal visual section.
  moving_jaw_loading_policy:
    separately_loaded_vhacd_pieces: [1, 2, 3, 4, 5]
    replaced_piece: 0
    replacement:
      type: box
      name: moving_finger_pad
      origin_xyz_m: [-0.0012969999878772, -0.050369580583936, 0.0033063194616967]
      origin_rpy_rad: [-1.5707963267949, 0.0, 3.11159265358979]
      size_xyz_m: [0.010, 0.014, 0.064]
      calibration_q_rad: 0.03
      center_in_fixed_jaw_m: [0.020, 0.0, 0.072]
      inner_face_x_in_fixed_jaw_m: 0.015
    aperture_at_calibration_q_m: 0.025
    aperture_center_x_m: 0.0025
    reason: The distal VHACD hull protrudes about 1 mm beyond the visual contact face. The explicit pad makes the q-to-aperture contract identical for ROS, Gazebo, and downstream simulators.
  stowed_pose_policy:
    source: ../../../alohamini_calibration/config/hardware/arm_home.yaml
    note: Installed encoder Home is mapped to the matching collision-free CAD Home; no additional ACM exclusions are used.
    srdf_false_positive_pairs: []
